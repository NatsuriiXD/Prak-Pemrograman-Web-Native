<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata</title>
    <link rel="stylesheet" href="../Assets/css/form.css">
</head>

<body>
    <form action="form4.html" method="POST">
        <fieldset>
            <legend>Formulir Peserta</legend>
            <p>
                <label>Nama Lengkap:</label>
                <input type="text" name="nama" placeholder="Masukan nama lengkap">
            </p>
            <p>
                <label>Username:</label>
                <input type="text" name="username" placeholder="Masukan username">
            </p>
            <p>
                <label>Password:</label>
                <input type="text" name="password" placeholder="Masukan password">
            </p>
            <p>
                <label>Jenis Kelamin:</label><br>
                <input type="radio" name="jenkel" value="laki-laki">Laki-laki
                <input type="radio" name="jenkel" value="perempuan">Perempuan
            </p>
            <p>
                <label>Tanggal Lahir:</label>
                <input type="date" name="tanggal_lahir">
            </p>
            <p>
                <label>Agama:</label>
                <select name="agama">
                    <option value="hindu">Hindu</option>
                    <option value="budha">Budha</option>
                    <option value="islam">Islam</option>
                    <option value="protestan">Kristen Protestan</option>
                    <option value="katolik">Kristen Katolik</option>
                </select>
            </p>
            <p>
                <label>Email:</label>
                <input type="email" name="email" placeholder="masukkan email">
            </p>
            <p>
                <label>Pilih Course/Materi:</label>
                <input type="checkbox" name="web_native" value="Web Native">Web Native
                <input type="checkbox" name="web_framework" value="Web Framework">Web Framework
                <input type="checkbox" name="mobile_native" value="Mobile Native">Mobile Native
                <input type="checkbox" name="mobile_platform" value="Mobile Lintas Platform">Mobile Lintas Platform
            </p>
            <p>
                <label>Alamat:</label><br>
                <textarea name="alamat" cols="50" rows="10"></textarea>
            </p>
            <p>
                <input type="submit" name="submit" value="Daftar">
            </p>
        </fieldset>
    </form>
</body>

</html>

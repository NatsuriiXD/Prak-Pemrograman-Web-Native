<!DOCTYPE html>
<html>

<head>
    <title>Penggunaan Selector</title>
    <link rel="stylesheet" type="text/css" href="../Assets/css/selector.css">
    
</head>

<body class="bg-yellow">
    <h2 id="header">Formulir Mahasiswa</h2>
    <form>
        <table border="0">
            <tr>
                <td>Nama Depan:</td>
                <td><input type="text" id="nama-depan" name="nama_depan"></td>
            </tr>
            <tr>
                <td>Nama Belakang:</td>
                <td><input type="text" id="nama-belakang" name="nama_belakang"></td>
            </tr>
            <tr>
                <td>Mahasiswa:</td>
                <td><input type="text" id="mahasiswa" name="mahasiswa"></td>
            </tr>
            <tr>
                <td>NIM:</td>
                <td><input type="text" id="nim" name="nim"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" name="submit" value="Kirim"></td>
            </tr>
        </table>
    </form>
</body>

</html>
